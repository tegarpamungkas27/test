name: macOS dengan VNC

on: 
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-latest
    
    steps:
    - name: Setup VNC Server
      run: |
        echo "🔧 Setting up VNC..."
        
        # Set password VNC
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate \
          -configure \
          -access -on \
          -users admin \
          -privs -all \
          -restart \
          -agent \
          -menu
        
        echo "✅ VNC is running on port 5900"
    
    - name: Install ngrok
      run: |
        echo "📥 Installing ngrok..."
        brew install --cask ngrok
    
    - name: Setup ngrok tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        echo "🚇 Creating ngrok tunnel..."
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        ngrok tcp 5900 --log=stdout &
        sleep 10
    
    - name: Get ngrok URL
      run: |
        echo "🌐 Fetching ngrok URL..."
        sleep 5
        
        NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
        NGROK_HOST=$(echo $NGROK_URL | sed 's/tcp:\/\///')
        
        echo ""
        echo "════════════════════════════════════════"
        echo "✅ VNC IS READY!"
        echo "════════════════════════════════════════"
        echo ""
        echo "🖥️  VNC Address: $NGROK_HOST"
        echo "🔑 Password: (check VNC settings)"
        echo ""
        echo "════════════════════════════════════════"
        echo ""
    
    - name: Keep session alive
      run: |
        echo "⏰ Keeping session alive for 2 hours..."
        echo "⚠️  JANGAN LUPA: Stop workflow setelah selesai!"
        
        for i in {1..120}; do
          echo "⏱️  Running... ($i/120 minutes)"
          sleep 60
        done
